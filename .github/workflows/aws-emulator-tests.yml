name: AWS Emulator tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install AWS Emulator
        run: |
          curl -fsSLo aws-emulator.deb https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          sudo apt-get install -y ./aws-emulator.deb
          aws-emulator -v

      - name: Start AWS Emulator in the background
        run: |
          nohup aws-emulator --telemetry off > emulator.log 2>&1 &
          for i in $(seq 30); do
            curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health && break
            sleep 1
          done
          curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health \
            || { echo "Emulator did not start"; cat emulator.log; exit 1; }

      - name: Point the AWS CLI and SDKs at the emulator
        run: |
          {
            echo "AWS_ENDPOINT_URL=https://127.0.0.1:9297"
            echo "AWS_SHARED_CREDENTIALS_FILE=$HOME/.aws/emulator/9297/emulator_credentials"
            echo "AWS_CONFIG_FILE=$HOME/.aws/emulator/9297/config"
            echo "AWS_CA_BUNDLE=$HOME/.aws/emulator/9297/ca.pem"
            echo "AWS_EC2_METADATA_DISABLED=true"
            echo "AWS_DISABLE_HOST_PREFIX_INJECTION=true"
            echo "AWS_REGION=us-east-1"
            echo "AWS_DEFAULT_REGION=us-east-1"
          } >> "$GITHUB_ENV"

      - name: Check the connection (account must be 000000000000)
        run: aws sts get-caller-identity

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Show emulator log if something failed
        if: failure()
        run: cat emulator.log || true
